name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 取消同 PR 上一次未完成的运行，避免重复消耗
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# 默认权限：只读 + issues/comments 写
permissions:
  contents: read

jobs:
  # ============================================================================
  # Job 1：honeycomb 包（pnpm install + typecheck + 全套确定性测试）
  # runner：ubuntu-latest（免费、快速，纯 Node 测试无需 macOS）
  # ============================================================================
  honeycomb-tests:
    name: Honeycomb tests (typecheck + smoke + deterministic suite, live auto-skip)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          # v10：与本机 10.16.1 对齐（pnpm-lock.yaml 由 v10 生成；v9 解析 v10 锁会误判 out-of-date）
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/honeycomb/package.json

      - name: Install dependencies
        working-directory: packages/honeycomb
        # frozen-lockfile：CI 必须可复现安装；lockfile 与 manifest 漂移直接红。
        # lockfile 现已随仓锁定提交（v10 生成），venv 假设已成立。
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: packages/honeycomb
        run: pnpm run typecheck

      - name: Run smoke
        working-directory: packages/honeycomb
        run: pnpm run test

      - name: 'Run deterministic test suite (12 pinned + native-runtime 条件纳入; live 自动 skip)'
        working-directory: packages/honeycomb
        run: |
          set -euo pipefail
          # Node test runner 一次拉起所有 *.test.ts（smoke 由上面 pnpm run test 单独跑，
          # 不重复跑以节省 wall time）。
          #
          # live / 外部依赖用例自带 skip 逻辑：
          #   - transport-client-live : 需 server 可达，CI 无外部 deps 会因 connect 失败自动 skip
          #   - connector-live        : opencode 未安装 → 内部 t.skip 命中（recorded+mock 部分仍跑）
          #   - acp-adapter live 子集 : 同上（mock 部分 + 纯函数 100% 跑）
          #   - acp-kimi-live       : live 三例需 RUN_ACP_LIVE=1 显式开启（CI 不设→skip）；
          #     catalog/detect 两例默认跑，detect 在无 kimi 机器（CI）内部自 skip
          #
          # 顺序按「先快后慢」编排：纯函数（persistence/e2e-core）→ transport →
          # orchestration → connector → adapter；live 的放最后即便 skip 也消耗最小 wall time。
          node --import tsx --test \
            test/persistence.test.ts \
            test/e2e-core.test.ts \
            test/transport-smoke.ts \
            test/transport-config.test.ts \
            test/transport-http.test.ts \
            test/transport-client.test.ts \
            test/transport-client-live.test.ts \
            test/orchestration-loop.test.ts \
            test/watchdog-repro.test.ts \
            test/connector-live.test.ts \
            test/acp-adapter.test.ts \
            test/acp-kimi-live.test.ts
          # native-runtime.test.ts 由编排线即将合入（task #01a000cd-97ba 系列）；
          # 显式列进上面的 --test 清单时若文件缺席会直接 MODULE_NOT_FOUND 红掉，
          # 故存在才跑——合入后自动纳入，无需再改本文件。
          if [ -f test/native-runtime.test.ts ]; then
            node --import tsx --test test/native-runtime.test.ts
          else
            echo "::notice::native-runtime.test.ts 未合入，本轮跳过（文件出现后自动纳入）"
          fi

      - name: Upload coverage & logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: honeycomb-test-logs
          path: |
            packages/honeycomb/**/*.log
            packages/honeycomb/test-results/
          if-no-files-found: ignore
          retention-days: 3

  # ============================================================================
  # Job 2：HarnessShell Swift 壳构建（macOS only）
  # runner：macos-14（Apple Silicon，免费档；SwiftPM 无外部依赖，可直接编）
  # ============================================================================
  harness-shell-build:
    name: HarnessShell swift build (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift toolchain
        run: |
          swift --version
          xcrun --show-sdk-path --sdk macosx

      - name: Resolve SwiftPM dependencies (warm cache)
        working-directory: HarnessShell
        run: swift package resolve

      - name: Build (release)
        working-directory: HarnessShell
        run: swift build -c release

      - name: Build (debug, sanity)
        working-directory: HarnessShell
        run: swift build

      - name: Upload .build artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: HarnessShell-build
          path: |
            HarnessShell/.build/release/HarnessShell
            HarnessShell/.build/debug/HarnessShell
          if-no-files-found: warn
          retention-days: 3

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: HarnessShell-build-logs
          path: |
            HarnessShell/.build/**/*.log
            ~/Library/Logs/DiagnosticReports/
          if-no-files-found: ignore
          retention-days: 3