#   push:
#     tags: ['v*.*.*']
#
# 与现有 cron (每日 20:00) 并存：cron 是老大，CI release 是快速通道。
# 触发前确保 tag 与 CHANGELOG 已人工校对（cron 任务里也有这一步）。
# ----------------------------------------------------------------------------