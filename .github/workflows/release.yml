name: Release

# 手动档优先——cron 每日 20:00 自动发版是「老大」，CI release 只做 workflow_dispatch 触发。
# 等打包链路（含 Developer ID + notarize）稳定后，再启用 tag 触发的正式 release。

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.1.0). 与现有 CHANGELOG.md [0.1.0] 段对齐。'
        required: true
        type: string
      draft:
        description: '是否作为 draft release（先发布再编辑）'
        required: false
        default: 'true'
        type: boolean

# 不取消同 tag 的运行——release 不能半截
concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

permissions:
  contents: write  # 创建 GitHub Release 需要写权限

jobs:
  release:
    name: Build macOS DMG + Slim ZIP + gh release upload (manual)
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 需要完整 git log 给 changelog 用

      - name: Show context
        run: |
          echo "tag = ${{ inputs.tag }}"
          echo "draft = ${{ inputs.draft }}"
          echo "ref = ${{ github.ref }}"
          git log -1 --oneline || true

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10  # 与 ci.yml 对齐（honeycomb job 已迁 v10）

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: packages/honeycomb/package.json

      - name: Install dependencies
        working-directory: packages/honeycomb
        run: pnpm install  # pnpm 10 移除 --no-audit/--no-fund

      - name: Build Swift shell (release)
        working-directory: HarnessShell
        run: swift build -c release

      # ====================================================================
      # 版本元数据提取：从 inputs.tag（如 v0.1.0-alpha.5）剥 v 前缀得 VERSION，
      #   正则抽出 alpha 后整数得 BUILD_NUMBER，统一塞 GITHUB_ENV 给后续 step 用。
      # 规则：v0.1.0-alpha.N → BUILD_NUMBER=N（严格单调；Sparkle 主排序键）
      # TODO: 切正线（0.2.x）时改用全局 build 计数器（cron chain 维护 .build-counter 文件）
      # ====================================================================
      - name: Extract VERSION + BUILD_NUMBER + filenames from tag
        id: version-meta
        env:
          TAG: ${{ inputs.tag }}
        run: |
          VERSION="${TAG#v}"
          BUILD_NUMBER="$(echo "${VERSION}" | sed -nE 's/.*-alpha\.([0-9]+)$/\1/p')"
          # 兜底：非 alpha.N 标签默认 build 号 = 1（待正线切全局计数器后改）
          [ -n "$BUILD_NUMBER" ] || BUILD_NUMBER=1
          FULL_DMG="WhalePod-${VERSION}-macos-arm64.dmg"
          SLIM_ZIP="WhalePod-${VERSION}-macos-arm64-slim.zip"
          FULL_ZIP="WhalePod-${VERSION}-macos-arm64.zip"
          {
            echo "VERSION=$VERSION"
            echo "BUILD_NUMBER=$BUILD_NUMBER"
            echo "FULL_DMG=$FULL_DMG"
            echo "SLIM_ZIP=$SLIM_ZIP"
            echo "FULL_ZIP=$FULL_ZIP"
          } >> "$GITHUB_ENV"
          echo "==> VERSION=$VERSION BUILD_NUMBER=$BUILD_NUMBER"
          echo "==> FULL_DMG=$FULL_DMG  SLIM_ZIP=$SLIM_ZIP  FULL_ZIP=$FULL_ZIP"

      - name: Build .app bundle — Full seed (后续 M0 注入 runtime)
        working-directory: HarnessShell
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: ./Scripts/build-app.sh release

      # ====================================================================
      # 注意：build-runtime.sh 会从 nodejs.org 下载 node tarball + 从 npm
      # registry 拉 dsh 全家桶。在 CI runner 里走默认网络即可，不需代理。
      # 仅 Full 档执行：Slim 档由 RuntimeBootstrap 探测链兜底（命中本机 node
      # 或 npx，无 node 时显示引导文案），不打包 node/dsh 进 .app。
      # ====================================================================
      - name: M0 bundled runtime (node + dsh) — Full only
        working-directory: HarnessShell
        run: ./Scripts/build-runtime.sh

      # ====================================================================
      # 签名档位：默认 ad-hoc（CI runner 无 Apple Developer 证书）。
      # 真实发版改用 sign.sh prod 档（需 DEVELOPER_ID / AC_PASSWORD secret）。
      # ====================================================================
      - name: Sign .app (ad-hoc) — Full
        run: |
          codesign --force --deep -s - HarnessShell/dist/HarnessShell.app
          codesign --verify --verbose HarnessShell/dist/HarnessShell.app

      - name: Package DMG — Full (主推档)
        working-directory: HarnessShell
        env:
          VERSION: ${{ env.VERSION }}
          # DMG_NAME 与 appcast enclosure 的 FULL_DMG 对齐（品牌化命名）；
          # 不传则 make-dmg.sh 默认 HarnessShell.dmg → appcast 指向不存在的资产（404）
          DMG_NAME: ${{ env.FULL_DMG }}
        run: ./Scripts/make-dmg.sh

      - name: Package ZIP — Full (parallel for fast download)
        working-directory: HarnessShell
        env:
          VERSION: ${{ env.VERSION }}
          # make-zip.sh 默认 ZIP_NAME=${APP_NAME}.zip=HarnessShell.zip（无品牌无版本）；
          # 这里显式传 versioned ZIP_NAME 与 Slim 档命名对齐
          ZIP_NAME: ${{ env.FULL_ZIP }}
        run: ./Scripts/make-zip.sh

      # ====================================================================
      # Slim 档（无 bundled node/dsh，命中 RuntimeBootstrap 探测链）：
      #   build-app（不跑 build-runtime）→ ad-hoc 验证 → make-zip
      #   产物：dist/WhalePod-<ver>-macos-arm64-slim.zip
      #
      # 复用 HarnessShell/Scripts/make-slim.sh（Flash-3 实现，Task #01a004cc）。
      # 关键约束：
      #   1. APP_NAME 默认 HarnessShell（SPM 产品名），切勿设 WhalePod
      #      —— WhalePod 仅是 ZIP_NAME 的事；set APP_NAME=WhalePod 会因
      #      无此 SPM 产品而构建失败（Flash-3 踩过的坑入档）。
      #   2. 顺序必须在 Full DMG/ZIP 之后：make-slim.sh 内部 build-app.sh
      #      会 `rm -rf dist/HarnessShell.app` 再重建，若先跑 Slim 会清掉
      #      Full 已带 runtime 的 .app，导致 DMG/ZIP 缺 node/dsh。
      # ====================================================================
      - name: Package Slim ZIP — Slim 档 (无 bundled runtime)
        working-directory: HarnessShell
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
        run: ./Scripts/make-slim.sh

      - name: Compute SHA256 — 双档
        run: |
          cd HarnessShell/dist
          # 双行：Full DMG + Full ZIP + Slim ZIP（如有）+ 其他 .zip 变体
          shasum -a 256 *.dmg *.zip 2>/dev/null | tee SHA256SUMS

      # ====================================================================
      # appcast.xml 生成（Sparkle 2 兼容）：
      #   - 复用 HarnessShell/Scripts/make-appcast.sh（Task #01a00575）
      #   - 1 item × 2 enclosure（Full DMG + Slim ZIP），同 build 号
      #   - sha256 走自定义 sha256 属性（proposal §4.1 B 方案约定，
      #     与 Sparkle ed25519 edSignature 字段分离避免语义混淆）
      #   - 维护语义：替换同 BUILD_NUMBER 的旧 item（去重），其余保留
      #   - cron 链挂点由 Leader 同步（本工作流只补手动档）
      # ====================================================================
      - name: Generate appcast.xml — 双 enclosure (Full + Slim)
        working-directory: HarnessShell
        env:
          VERSION: ${{ env.VERSION }}
          BUILD_NUMBER: ${{ env.BUILD_NUMBER }}
          FULL_DMG: ${{ env.FULL_DMG }}
          SLIM_ZIP: ${{ env.SLIM_ZIP }}
        run: ./Scripts/make-appcast.sh

      - name: Create GitHub Release — 双档上传
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          DRAFT: ${{ inputs.draft }}
        run: |
          gh release create "$TAG" \
            --title "WhalePod $TAG" \
            --notes-file <(awk '/^## \[0\.1\.0\]/,/^## \[/' CHANGELOG.md | sed '$d') \
            --draft="$DRAFT" \
            HarnessShell/dist/*.dmg \
            HarnessShell/dist/*.zip \
            HarnessShell/dist/SHA256SUMS

      # appcast.xml 单独 --clobber 上传：re-run 同一 tag 时不冲突；
      # Swift M1 按 releases/latest/download/appcast.xml 拉取（需 release 已 publish）
      - name: Upload appcast.xml — Sparkle 通道稳定 URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release upload "$TAG" HarnessShell/dist/appcast.xml --clobber

      - name: Upload artifacts for debugging
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-${{ inputs.tag }}-artifacts
          path: |
            HarnessShell/dist/*.dmg
            HarnessShell/dist/*.zip
            HarnessShell/dist/SHA256SUMS
            HarnessShell/dist/appcast.xml
          retention-days: 14

# ----------------------------------------------------------------------------
