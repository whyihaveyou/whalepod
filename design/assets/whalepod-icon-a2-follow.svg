<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 鲸群 WhalePod · A2-②：领鲸 + 跟随者同游
       保留 A 的对角动势，小号鲸沿同一运动线尾随（层级递减） -->
  <defs>
    <radialGradient id="seaE" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#14203A"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </radialGradient>
    <linearGradient id="whaleE" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <g id="whaleE2">
      <path d="M 16 56
               C 14 46 22 36 38 30
               C 58 22 82 26 92 40
               C 98 48 96 58 86 64
               C 68 76 40 76 26 68
               C 20 64 16 60 16 56 Z"/>
      <path d="M 18 48 C 8 44 2 34 6 24 C 11 31 16 33 21 33
               C 19 26 22 19 29 17 C 29 26 31 33 36 38 C 30 43 23 47 18 48 Z"/>
    </g>
  </defs>

  <rect x="102" y="102" width="820" height="820" rx="186" fill="url(#seaE)"/>

  <!-- 领鲸前方的声波弧（短促、向前） -->
  <g fill="none" stroke-linecap="round">
    <path d="M 780 340 A 100 100 0 0 1 838 432" stroke="#22D3EE" stroke-width="22" opacity="0.85"/>
    <path d="M 816 300 A 160 160 0 0 1 902 432" stroke="#7A4DFF" stroke-width="16" opacity="0.4"/>
  </g>

  <!-- 领鲸：中右，最大 -->
  <use href="#whaleE2" transform="translate(420,400) rotate(-10) scale(4.3)" fill="url(#whaleE)"/>
  <!-- 跟随者 1：左下尾随，中号 -->
  <use href="#whaleE2" transform="translate(232,560) rotate(-10) scale(2.6)" fill="#22D3EE" opacity="0.7"/>
  <!-- 跟随者 2：更后更下，小号 -->
  <use href="#whaleE2" transform="translate(140,668) rotate(-10) scale(1.7)" fill="#7A4DFF" opacity="0.5"/>
</svg>
