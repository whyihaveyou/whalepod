<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 鲸群 WhalePod · 概念 B：鲸群纵队（三头鲸编队上游）
       意象：lead 大鲸带队 + 队友跟随 = 多智能体协作 -->
  <defs>
    <radialGradient id="seaB" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#14203A"/>
      <stop offset="1" stop-color="#0A0F1C"/>
    </radialGradient>
    <linearGradient id="whaleB" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
  </defs>

  <rect x="102" y="102" width="820" height="820" rx="186" fill="url(#seaB)"/>

  <!-- 鲸形单元（朝右，几何剪影） -->
  <defs>
    <g id="whale">
      <path d="M 16 56
               C 14 46 22 36 38 30
               C 58 22 82 26 92 40
               C 98 48 96 58 86 64
               C 68 76 40 76 26 68
               C 20 64 16 60 16 56 Z"/>
      <path d="M 18 48 C 8 44 2 34 6 24 C 11 31 16 33 21 33
               C 19 26 22 19 29 17 C 29 26 31 33 36 38 C 30 43 23 47 18 48 Z"/>
    </g>
  </defs>

  <!-- 领队大鲸：左下，最大 -->
  <use href="#whale" transform="translate(240,500) rotate(-10) scale(4.6)" fill="url(#whaleB)"/>
  <!-- 跟随鲸 2：中右，中号 -->
  <use href="#whale" transform="translate(560,380) rotate(-10) scale(2.9)" fill="#22D3EE" opacity="0.75"/>
  <!-- 跟随鲸 3：右上，小号 -->
  <use href="#whale" transform="translate(700,270) rotate(-10) scale(1.9)" fill="#7A4DFF" opacity="0.6"/>
</svg>
